name: Verify provider change

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/ci/requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e '.[test]'
      - run: python -m pip check
      - run: python -m pytest -q
